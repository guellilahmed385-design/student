<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyMate | Student Dashboard</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #101827;
    color: white;
    padding: 25px;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

header h1 {
    color: #60a5fa;
    font-size: 35px;
}

.container {
    max-width: 900px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.card {
    background: #1e293b;
    padding: 22px;
    border-radius: 15px;
}

h2 {
    color: #60a5fa;
}

button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #2563eb;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 7px;
    border: none;
}

#timer {
    font-size: 45px;
    text-align: center;
    margin: 20px;
}

li {
    padding: 8px;
    background: #334155;
    margin: 7px 0;
    border-radius: 7px;
    overflow-wrap: anywhere;
}

.stats {
    font-size: 24px;
    color: #4ade80;
}
</style>
</head>

<body>

<header>
    <h1>🎓 StudyMate</h1>
    <p>Your personal student productivity dashboard</p>
</header>

<div class="container">

    <!-- Pomodoro -->
    <div class="card">
        <h2>⏱️ Pomodoro Timer</h2>
        <div id="timer">25:00</div>
        <button onclick="startTimer()">Start</button>
        <button onclick="pauseTimer()">Pause</button>
        <button onclick="resetTimer()">Reset</button>
    </div>

    <!-- Tasks -->
    <div class="card">
        <h2>📝 My Tasks</h2>
        <input id="taskInput" placeholder="Enter your task...">
        <button onclick="addTask()">Add Task</button>
        <ul id="taskList"></ul>
    </div>

    <!-- Flashcards -->
    <div class="card">
        <h2>📚 Flashcards</h2>
        <input id="question" placeholder="Question">
        <input id="answer" placeholder="Answer">
        <button onclick="addCard()">Save Flashcard</button>
        <hr>
        <p id="flashQuestion">Your flashcards will appear here.</p>
        <p id="flashAnswer"></p>
        <button onclick="showAnswer()">Show Answer</button>
        <button onclick="nextCard()">Next Card</button>
    </div>

    <!-- Statistics -->
    <div class="card">
        <h2>📊 Study Statistics</h2>
        <p>Completed Pomodoro sessions:</p>
        <div class="stats" id="sessions">0</div>
        <p>Keep going! 💪</p>
    </div>

</div>

<script>

// Pomodoro Timer
let time = 25 * 60;
let interval = null;
let sessions = Number(localStorage.getItem("sessions")) || 0;

function updateTimer() {
    let minutes = Math.floor(time / 60);
    let seconds = time % 60;

    document.getElementById("timer").textContent =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
}

function startTimer() {
    if (interval) return;

    interval = setInterval(() => {
        if (time > 0) {
            time--;
            updateTimer();
        } else {
            clearInterval(interval);
            interval = null;

            sessions++;
            localStorage.setItem("sessions", sessions);
            updateStats();

            alert("Pomodoro completed! Take a break 🎉");
            time = 25 * 60;
            updateTimer();
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(interval);
    interval = null;
}

function resetTimer() {
    pauseTimer();
    time = 25 * 60;
    updateTimer();
}

// Task Manager
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function renderTasks() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
        const li = document.createElement("li");
        li.textContent = task;

        const del = document.createElement("button");
        del.textContent = "❌";
        del.onclick = () => {
            tasks.splice(index, 1);
            saveTasks();
        };

        li.appendChild(del);
        list.appendChild(li);
    });
}

function addTask() {
    const input = document.getElementById("taskInput");
    const value = input.value.trim();

    if (!value) return;

    tasks.push(value);
    input.value = "";
    saveTasks();
}

function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
    renderTasks();
}

// Flashcards
let cards = JSON.parse(localStorage.getItem("cards")) || [];
let current = 0;

function addCard() {
    const q = document.getElementById("question").value.trim();
    const a = document.getElementById("answer").value.trim();

    if (!q || !a) return;

    cards.push({question: q, answer: a});
    localStorage.setItem("cards", JSON.stringify(cards));

    document.getElementById("question").value = "";
    document.getElementById("answer").value = "";

    current = cards.length - 1;
    renderCard();
}

function renderCard() {
    if (!cards.length) {
        document.getElementById("flashQuestion").textContent =
            "No flashcards yet.";
        document.getElementById("flashAnswer").textContent = "";
        return;
    }

    document.getElementById("flashQuestion").textContent =
        cards[current].question;

    document.getElementById("flashAnswer").textContent = "";
}

function showAnswer() {
    if (!cards.length) return;

    document.getElementById("flashAnswer").textContent =
        cards[current].answer;
}

function nextCard() {
    if (!cards.length) return;

    current = (current + 1) % cards.length;
    renderCard();
}

// Statistics
function updateStats() {
    document.getElementById("sessions").textContent = sessions;
}

updateTimer();
updateStats();
renderTasks();
renderCard();

</script>

</body>
</html>
